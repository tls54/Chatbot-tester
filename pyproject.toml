[project]
name = "chatbot-tester"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = ["llm", "harness"]

[project.optional-dependencies]
groq = ["llm[groq]"]
anthropic = ["llm[anthropic]"]
openai = ["llm[openai]"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
llm = { workspace = true }
harness = { workspace = true }
toy-target = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: hits a real external API (needs keys in .env); run with -m live"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
