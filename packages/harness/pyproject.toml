[project]
name = "harness"
version = "0.0.0"
description = "Multi-turn red-teaming harness"
requires-python = ">=3.11"
dependencies = ["llm", "pydantic>=2", "httpx>=0.27"]

[tool.uv.sources]
llm = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]
