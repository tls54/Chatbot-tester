[project]
name = "toy-target"
version = "0.0.0"
description = "Deliberately vulnerable toy chatbot + MCP server (test target only)"
requires-python = ">=3.11"
dependencies = ["llm", "pydantic>=2"]

[tool.uv.sources]
llm = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toy_target"]
