[project]
name = "llm"
version = "0.0.0"
description = "Provider-agnostic LLM client abstraction"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "python-dotenv>=1"]

[project.optional-dependencies]
groq = ["groq>=0.11"]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm"]
